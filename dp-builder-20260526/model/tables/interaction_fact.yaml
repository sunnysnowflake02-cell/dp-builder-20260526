tables:
  - name: interaction_fact
    title: Interaction Fact
    sql: {{ load_sql('interaction_fact') }}
    description: This table captures customer interactions across various channels and types.
    public: true
    dimensions:
      - name: interaction_id
        description: Unique identifier for the interaction.
        type: string
        column: interaction_id
        primary_key: true
        public: true
      - name: customer_id
        description: Identifier for the customer involved in the interaction.
        type: string
        column: customer_id
        public: true
        meta:
          secure:
            func: redact
            user_groups:
              includes:
                - masking_redacted
      - name: interaction_type
        description: Type of interaction (e.g., purchase, inquiry).
        type: string
        column: interaction_type
        public: true
      - name: interaction_ts
        description: Timestamp of the interaction.
        type: time
        column: interaction_ts
        public: true
      - name: channel
        description: Channel through which the interaction occurred.
        type: string
        column: channel
        public: true
      - name: value
        description: Value associated with the interaction.
        type: number
        column: value
        public: true
      - name: session_id
        description: Identifier for the session during which the interaction occurred.
        type: string
        column: session_id
        public: true
      - name: created_at
        description: Timestamp when the record was created.
        type: time
        column: created_at
        public: true
      - name: ingestion_date
        description: Timestamp when the record was ingested.
        type: time
        column: ingestion_date
        public: true
    measures:
      - name: row_count
        description: Distinct rows at natural grain (count distinct on primary key column).
        type: count
        sql: "{TABLE.interaction_id}"
