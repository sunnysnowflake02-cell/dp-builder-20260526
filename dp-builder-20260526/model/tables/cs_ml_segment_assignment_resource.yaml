tables:
  - name: cs_ml_segment_assignment_resource
    title: Customer Segment Assignment Resource
    sql: {{ load_sql('cs_ml_segment_assignment_resource') }}
    description: |
      This table contains information about customer segment assignments including assignment
      details and timestamps.
    public: true
    dimensions:
      - name: pk
        description: Primary key for the segment assignment record.
        type: string
        column: pk
        primary_key: true
        public: true
      - name: assignment_id
        description: Unique identifier for the assignment.
        type: string
        column: assignment_id
        public: true
      - name: customer_id
        description: Identifier for the customer associated with the segment assignment.
        type: string
        column: customer_id
        public: true
        meta:
          secure:
            func: redact
            user_groups:
              includes:
                - masking_redacted
      - name: segment_id
        description: Identifier for the segment to which the customer is assigned.
        type: string
        column: segment_id
        public: true
      - name: model_version
        description: Version of the model used for segment assignment.
        type: string
        column: model_version
        public: true
      - name: assigned_date
        description: Date when the segment was assigned to the customer.
        type: time
        column: assigned_date
        public: true
      - name: segment_score
        description: Score representing the strength of the segment assignment.
        type: number
        column: segment_score
        public: true
      - name: created_at
        description: Timestamp when the record was created.
        type: time
        column: created_at
        public: true
      - name: _nilus_load_id
        description: Load identifier for Nilus.
        type: string
        column: _nilus_load_id
        public: true
      - name: _nilus_id
        description: Nilus identifier for the record.
        type: string
        column: _nilus_id
        public: true
    measures:
      - name: row_count
        description: Distinct rows at natural grain (count distinct on primary key column).
        type: count
        sql: "{TABLE.pk}"
      - name: avg_segment_score
        description: Average of segment score for rows in this grain.
        type: avg
        sql: "{TABLE.segment_score}"
