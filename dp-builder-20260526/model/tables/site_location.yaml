tables:
  - name: site_location
    title: Site Location
    sql: {{ load_sql('site_location') }}
    description: Geographical data for nuclear sites, including latitude and longitude.
    public: true
    dimensions:
      - name: site_name
        description: The name of the nuclear site.
        type: string
        column: site_name
        primary_key: true
        public: true
      - name: latitude
        description: The latitude of the nuclear site.
        type: number
        column: latitude
        public: true
      - name: longitude
        description: The longitude of the nuclear site.
        type: number
        column: longitude
        public: true
    measures:
      - name: row_count
        description: Distinct rows at natural grain (count distinct on primary key column).
        type: count
        sql: "{TABLE.site_name}"
