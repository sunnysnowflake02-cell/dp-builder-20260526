tables:
  - name: finding_violations_data
    title: Finding Violations Data
    sql: {{ load_sql('finding_violations_data') }}
    description: |
      Data regarding violations found during inspections, including details about the procedures
      and severity.
    public: true
    joins:
      - name: exercise_schedule_data
        relationship: many_to_one
        sql: "{TABLE.site_name} = {exercise_schedule_data.facility}"
      - name: site_location
        relationship: many_to_one
        sql: "{TABLE.site_name} = {site_location.site_name}"
    dimensions:
      - name: procedure
        description: The procedure under which the violation was found.
        type: string
        column: procedure
        primary_key: true
        public: true
      - name: issue_date
        description: The date when the violation was issued.
        type: time
        column: issue_date
        public: true
      - name: report_number
        description: The report number associated with the violation.
        type: number
        column: report_number
        public: true
      - name: type
        description: The type of violation.
        type: string
        column: type
        public: true
      - name: cornerstone_code
        description: The cornerstone code related to the violation.
        type: string
        column: cornerstone_code
        public: true
      - name: cornerstone
        description: The cornerstone associated with the violation.
        type: string
        column: cornerstone
        public: true
      - name: title
        description: The title of the violation report.
        type: string
        column: title
        public: true
      - name: docket_number
        description: The docket number related to the violation.
        type: string
        column: docket_number
        public: true
      - name: site_name
        description: The name of the site where the violation occurred.
        type: string
        column: site_name
        public: true
      - name: site_code
        description: The code of the site where the violation occurred.
        type: string
        column: site_code
        public: true
      - name: cross_cutting_aspect
        description: The cross-cutting aspect of the violation.
        type: string
        column: cross_cutting_aspect
        public: true
      - name: idby
        description: Identifier for the person who identified the violation.
        type: string
        column: idby
        public: true
      - name: region
        description: The region where the violation was found.
        type: number
        column: region
        public: true
      - name: accession_number
        description: The accession number for the violation report.
        type: string
        column: accession_number
        public: true
      - name: is_traditional_enforcement
        description: Indicates if the violation is subject to traditional enforcement.
        type: boolean
        column: is_traditional_enforcement
        public: true
      - name: item_severity_type_code
        description: Code representing the severity of the violation.
        type: string
        column: item_severity_type_code
        public: true
      - name: cornerstone_attribute_type
        description: Attribute type related to the cornerstone.
        type: time
        column: cornerstone_attribute_type
        public: true
      - name: link
        description: Link to additional information about the violation.
        type: string
        column: link
        public: true
      - name: year
        description: The year when the violation was reported.
        type: number
        column: year
        public: true
      - name: quarter
        description: The quarter of the year when the violation was reported.
        type: number
        column: quarter
        public: true
      - name: cross_cutting_area
        description: Area of the violation that cuts across multiple aspects.
        type: string
        column: cross_cutting_area
        public: true
      - name: significance
        description: Significance level of the violation.
        type: string
        column: significance
        public: true
      - name: significance_sort
        description: Sorting value for significance of the violation.
        type: number
        column: significance_sort
        public: true
    measures:
      - name: row_count
        description: Distinct rows at natural grain (count distinct on primary key column).
        type: count
        sql: "{TABLE.procedure}"
    segments:
      - name: violation_records_region_3
        sql: "{TABLE}.region = 3"
        meta:
          secure:
            user_groups:
              includes:
                - violation_inspection_auditor
