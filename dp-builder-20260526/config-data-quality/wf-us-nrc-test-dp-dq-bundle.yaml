name: wf-us-nrc-test-dp-dq-bundle
version: v1
type: workflow
tags:
  - Quality.BusinessRule
  - Tier.Generated
  - SemanticModelAgent
description: |
  Consolidated business-rule data quality checks for this lens. One workflow;
  multiple source datasets under stackSpec.inputs.
workspace: public
workflow:
  dag:
    - name: us-nrc-test-dp-dq-bundle
      description: |
        Consolidated DQ checks for approved steward rules (multi-table).
      title: Consolidated business validation checks
      spec:
        stack: soda+python:1.0
        logLevel: INFO
        compute: runnable-default
        resources:
          requests:
            cpu: 500m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        stackSpec:
          inputs:
            - dataset: dataos://icebase:us_nrc_data/exercise_schedule_data
              options:
                engine: minerva
                clusterName: minervac
              checks:
                - row_count > 0:
                    attributes:
                      category: Freshness
                      description: "Table must have data"
                - failed rows:
                    name: participant_count_positive
                    fail condition: |
                      TRY_CAST(participant_count AS DOUBLE) <= 0
                    attributes:
                      category: Completeness
                      description: "The 'participant_count' in the exercise_schedule_data table should always be greater than zero to ensure that exercises are being conducted with actual participants. The current sample shows valid counts, but this rule enforces ongoing data quality."
              profile:
                columns:
                  - "*"

            - dataset: dataos://icebase:us_nrc_data/finding_violations_data
              options:
                engine: minerva
                clusterName: minervac
              checks:
                - row_count > 0:
                    attributes:
                      category: Freshness
                      description: "Table must have data"
                - failed rows:
                    name: issue_date_not_future
                    fail condition: |
                      TRY_CAST(issue_date AS DATE) > CURRENT_DATE
                    attributes:
                      category: Validity
                      description: "The 'issue_date' column in the finding_violations_data table must not contain future dates, as this would indicate a reporting error. The current profiling indicates that all observed dates are in the past, but this check ensures data integrity moving forward."
              profile:
                columns:
                  - "*"

            - dataset: dataos://icebase:us_nrc_data/site_location
              options:
                engine: minerva
                clusterName: minervac
              checks:
                - row_count > 0:
                    attributes:
                      category: Freshness
                      description: "Table must have data"
                - failed rows:
                    name: latitude_longitude_validity
                    fail condition: |
                      TRY_CAST(latitude AS DOUBLE) < -90 OR TRY_CAST(latitude AS DOUBLE) > 90 OR TRY_CAST(longitude AS DOUBLE) < -180 OR TRY_CAST(longitude AS DOUBLE) > 180
                    attributes:
                      category: Validity
                      description: "The 'latitude' and 'longitude' columns in the site_location table must fall within valid geographical ranges. Latitude should be between -90 and 90, and longitude between -180 and 180, ensuring accurate site mapping. Current data appears valid, but this rule is crucial for geographic integrity."
              profile:
                columns:
                  - "*"