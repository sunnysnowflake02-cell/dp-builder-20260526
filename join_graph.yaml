version: v1
lens: supply-chain-data-product
description: Semantic join graph for this product. Each Lens SQL file remains a single-table SELECT; relationships below define
  how logical tables connect for analytics and validation.
edges:
- left_table: orders
  right_table: shipments
  left_fqn: icebase.supply_chain.orders
  right_fqn: icebase.supply_chain.shipments
  join_on:
  - left: order_id
    right: order_id
  cardinality: one_to_many
  id: 3539099f-a6d3-4d1c-b797-51391a89e2cb
  rationale: Orders can have multiple shipments associated with them.
- left_table: inventory
  right_table: warehouses
  left_fqn: icebase.supply_chain.inventory
  right_fqn: icebase.supply_chain.warehouses
  join_on:
  - left: warehouse_id
    right: warehouse_id
  cardinality: one_to_many
  id: fddc3733-5314-479b-ad29-a4dc645e2286
  rationale: Each warehouse can hold multiple SKUs.
- left_table: warehouses
  right_table: geolocation
  left_fqn: icebase.supply_chain.warehouses
  right_fqn: icebase.supply_chain.geolocation
  join_on:
  - left: zip_code
    right: zip_code
  cardinality: one_to_one
  id: 339d575b-078c-4f10-a247-a787e70e4a1c
  rationale: Geolocation data is tied to warehouse zip codes.
- left_table: shipments
  right_table: warehouses
  left_fqn: icebase.supply_chain.shipments
  right_fqn: icebase.supply_chain.warehouses
  join_on:
  - left: warehouse_id
    right: warehouse_id
  cardinality: many_to_one
  id: b86c692b-3f6e-48ff-bad9-afff4315dfc7
  rationale: Shipments originate from warehouses.
