user_groups:
  - name: masking_redacted
    api_scopes:
      - meta
      - data
      - graphql
      - jobs
      - source
    includes: '*'
  - name: warehouse_operators
    api_scopes:
      - meta
      - data
      - graphql
      - jobs
      - source
    includes:
      - users:id:warehouse_ops_user_1
      - users:id:warehouse_ops_user_2
  - name: shipping_analysts
    api_scopes:
      - meta
      - data
      - graphql
      - jobs
      - source
    includes:
      - users:id:shipping_analyst_1
      - users:id:shipping_analyst_2
  - name: inventory_managers
    api_scopes:
      - meta
      - data
      - graphql
      - jobs
      - source
    includes:
      - users:id:inventory_manager_1
      - users:id:inventory_manager_2
