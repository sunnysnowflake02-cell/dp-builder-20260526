tables:
  - name: inventory
    title: Inventory Data
    sql: {{ load_sql('inventory') }}
    description: Table containing inventory details for products in warehouses.
    public: true
    joins:
      - name: warehouses
        relationship: one_to_many
        sql: "{TABLE.warehouse_id} = {warehouses.warehouse_id}"
    dimensions:
      - name: sku_name
        description: Name of the stock keeping unit (SKU).
        type: string
        column: sku_name
        public: true
      - name: sku_id
        description: Unique identifier for the SKU.
        type: number
        column: sku_id
        primary_key: true
        public: true
      - name: warehouse_id
        description: Identifier for the warehouse where the inventory is stored.
        type: number
        column: warehouse_id
        public: true
      - name: quantity_in_stock
        description: Current quantity of the SKU in stock.
        type: number
        column: quantity_in_stock
        public: true
      - name: warehouse_zip_code
        description: Zip code of the warehouse location.
        type: number
        column: warehouse_zip_code
        public: true
      - name: reorder_qty
        description: Quantity to reorder when stock is low.
        type: number
        column: reorder_qty
        public: true
      - name: supplier_name
        description: Name of the supplier for the SKU.
        type: string
        column: supplier_name
        public: true
      - name: supplier_id
        description: Unique identifier for the supplier.
        type: number
        column: supplier_id
        public: true
    measures:
      - name: row_count
        description: Distinct rows at natural grain (count distinct on primary key column).
        type: count
        sql: "{TABLE.sku_id}"
