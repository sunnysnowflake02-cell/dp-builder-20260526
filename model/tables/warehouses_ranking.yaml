tables:
  - name: warehouses_ranking
    title: Warehouses Ranking Data
    sql: {{ load_sql('warehouses_ranking') }}
    description: Ranking data for warehouses based on efficiency scores.
    public: true
    dimensions:
      - name: warehouse_id
        description: Unique identifier for the warehouse.
        type: number
        column: warehouse_id
        primary_key: true
        public: true
      - name: efficiency_score_pct
        description: Efficiency score percentage for the warehouse.
        type: number
        column: efficiency_score_pct
        public: true
      - name: efficiency_rank
        description: Rank of the warehouse based on efficiency.
        type: number
        column: efficiency_rank
        public: true
    measures:
      - name: row_count
        description: Distinct rows at natural grain (count distinct on primary key column).
        type: count
        sql: "{TABLE.warehouse_id}"
      - name: avg_efficiency_score_pct
        description: Average of efficiency score pct for rows in this grain.
        type: avg
        sql: "{TABLE.efficiency_score_pct}"
