tables:
  - name: order_items
    title: Order Items Data
    sql: {{ load_sql('order_items') }}
    description: Details of items included in customer orders.
    public: true
    joins:
      - name: orders
        relationship: many_to_one
        sql: "{TABLE.order_id} = {orders.order_id}"
    dimensions:
      - name: order_id
        description: Unique identifier for the order.
        type: number
        column: order_id
        primary_key: true
        public: true
      - name: sku_id
        description: Identifier for the stock keeping unit.
        type: number
        column: sku_id
        public: true
      - name: category
        description: Category of the item ordered.
        type: string
        column: category
        public: true
      - name: qty
        description: Quantity of the item ordered.
        type: number
        column: qty
        public: true
      - name: price
        description: Price of the item ordered.
        type: number
        column: price
        public: true
      - name: total_sale_value
        description: Total sale value of the item ordered.
        type: number
        column: total_sale_value
        public: true
    measures:
      - name: row_count
        description: Distinct rows at natural grain (count distinct on primary key column).
        type: count
        sql: "{TABLE.order_id}"
      - name: sum_price
        description: Sum of price for rows in this grain.
        type: sum
        sql: "{TABLE.price}"
      - name: avg_price
        description: Average of price for rows in this grain.
        type: avg
        sql: "{TABLE.price}"
