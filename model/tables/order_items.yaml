tables:
  - name: order_items
    title: Order Items Data
    sql: {{ load_sql('order_items') }}
    description: Details of items included in each order.
    public: true
    joins:
      - name: inventory
        relationship: many_to_one
        sql: "{TABLE.sku_id} = {inventory.sku_id}"
    dimensions:
      - name: order_id
        description: Unique identifier for the order.
        type: number
        column: order_id
        primary_key: true
        public: true
      - name: sku_id
        description: Unique identifier for the SKU ordered.
        type: number
        column: sku_id
        public: true
      - name: category
        description: Category of the SKU.
        type: string
        column: category
        public: true
      - name: qty
        description: Quantity of the SKU ordered.
        type: number
        column: qty
        public: true
      - name: price
        description: Price of the SKU at the time of order.
        type: number
        column: price
        public: true
      - name: total_sale_value
        description: Total sale value for the ordered quantity of the SKU.
        type: number
        column: total_sale_value
        public: true
    measures:
      - name: row_count
        description: Distinct rows at natural grain (count distinct on primary key column).
        type: count
        sql: "{TABLE.order_id}"
      - name: total_order_items
        description: Total number of items ordered across all orders.
        type: sum
        sql: "SUM({TABLE.qty})"
