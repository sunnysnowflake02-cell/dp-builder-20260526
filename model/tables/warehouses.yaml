tables:
  - name: warehouses
    title: Warehouses Data
    sql: {{ load_sql('warehouses') }}
    description: Details of warehouses including performance metrics.
    public: true
    joins:
      - name: geolocation
        relationship: one_to_one
        sql: "{TABLE.zip_code} = {geolocation.zip_code}"
    dimensions:
      - name: warehouse_id
        description: Unique identifier for the warehouse.
        type: number
        column: warehouse_id
        primary_key: true
        public: true
      - name: district
        description: District where the warehouse is located.
        type: string
        column: district
        public: true
      - name: zip_code
        description: Zip code for the warehouse location.
        type: number
        column: zip_code
        public: true
      - name: wh_orders_lw
        description: Last week orders processed by the warehouse.
        type: number
        column: wh_orders_lw
        public: true
      - name: wh_orders_lq
        description: Last quarter orders processed by the warehouse.
        type: number
        column: wh_orders_lq
        public: true
      - name: wh_orders_ly
        description: Last year orders processed by the warehouse.
        type: number
        column: wh_orders_ly
        public: true
      - name: wh_orders_avg_daily
        description: Average daily orders processed by the warehouse.
        type: number
        column: wh_orders_avg_daily
        public: true
      - name: wh_orders_l24
        description: Last 24 hours orders processed by the warehouse.
        type: number
        column: wh_orders_l24
        public: true
      - name: updated_on
        description: Timestamp of the last update to the warehouse data.
        type: time
        column: updated_on
        public: true
    measures:
      - name: row_count
        description: Distinct rows at natural grain (count distinct on primary key column).
        type: count
        sql: "{TABLE.warehouse_id}"
      - name: total_orders_processed
        description: Total number of orders processed by all warehouses.
        type: sum
        sql: "SUM({TABLE.wh_orders_lw})"
