tables:
  - name: warehouses
    title: Warehouses Data
    sql: {{ load_sql('warehouses') }}
    description: Information about warehouses including location and order statistics.
    public: true
    dimensions:
      - name: warehouse_id
        description: Unique identifier for the warehouse.
        type: number
        column: warehouse_id
        primary_key: true
        public: true
      - name: district
        description: District where the warehouse is located.
        type: string
        column: district
        public: true
      - name: zip_code
        description: Zip code of the warehouse location.
        type: number
        column: zip_code
        public: true
      - name: wh_orders_lw
        description: Last week orders count for the warehouse.
        type: number
        column: wh_orders_lw
        public: true
      - name: wh_orders_lq
        description: Last quarter orders count for the warehouse.
        type: number
        column: wh_orders_lq
        public: true
      - name: wh_orders_ly
        description: Last year orders count for the warehouse.
        type: number
        column: wh_orders_ly
        public: true
      - name: wh_orders_avg_daily
        description: Average daily orders for the warehouse.
        type: number
        column: wh_orders_avg_daily
        public: true
      - name: wh_orders_l24
        description: Last 24 hours orders count for the warehouse.
        type: number
        column: wh_orders_l24
        public: true
      - name: updated_on
        description: Timestamp of the last update to the warehouse data.
        type: time
        column: updated_on
        public: true
    measures:
      - name: row_count
        description: Distinct rows at natural grain (count distinct on primary key column).
        type: count
        sql: "{TABLE.warehouse_id}"
    segments:
      - name: miami_warehouses
        sql: "{TABLE}.district = 'Miami'"
        meta:
          secure:
            user_groups:
              includes:
                - warehouse_manager_miami
