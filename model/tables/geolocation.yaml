tables:
  - name: geolocation
    title: Geolocation Data
    sql: {{ load_sql('geolocation') }}
    description: Contains geolocation data for delivery addresses and warehouses.
    public: true
    dimensions:
      - name: zip_code
        description: Zip code for the delivery or warehouse location.
        type: number
        column: zip_code
        primary_key: true
        public: true
      - name: latitude
        description: Latitude coordinate for the location.
        type: number
        column: latitude
        public: true
      - name: longitude
        description: Longitude coordinate for the location.
        type: number
        column: longitude
        public: true
    measures:
      - name: row_count
        description: Distinct rows at natural grain (count distinct on primary key column).
        type: count
        sql: "{TABLE.zip_code}"
