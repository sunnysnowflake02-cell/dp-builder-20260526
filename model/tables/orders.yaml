tables:
  - name: orders
    title: Orders Data
    sql: {{ load_sql('orders') }}
    description: Table containing order details including customer and delivery information.
    public: true
    joins:
      - name: shipments
        relationship: one_to_many
        sql: "{TABLE.order_id} = {shipments.order_id}"
    dimensions:
      - name: order_id
        description: Unique identifier for the order.
        type: number
        column: order_id
        primary_key: true
        public: true
      - name: order_creation_date
        description: Date when the order was created.
        type: time
        column: order_creation_date
        public: true
      - name: customer_id
        description: Unique identifier for the customer placing the order.
        type: number
        column: customer_id
        public: true
      - name: delivery_address
        description: Address where the order is to be delivered.
        type: string
        column: delivery_address
        public: true
        meta:
          secure:
            func: redact
            user_groups:
              includes:
                - masking_redacted
      - name: zip_code
        description: Zip code for the delivery address.
        type: number
        column: zip_code
        public: true
      - name: delivery_date_chosen
        description: Date chosen for delivery of the order.
        type: time
        column: delivery_date_chosen
        public: true
    measures:
      - name: row_count
        description: Distinct rows at natural grain (count distinct on primary key column).
        type: count
        sql: "{TABLE.order_id}"
