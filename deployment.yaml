name: schema-supply-chain
version: v1alpha
type: lens
tags:
- Tier.Generated
- SemanticModelAgent
description: The Supply Chain 360 Data Product Blueprint provides stakeholders with a comprehensive view of inventory levels,
  warehouse performance, and fulfillment logistics, enabling informed decision-making across the supply chain. By integrating
  data from various entities such as orders, shipments, and delivery addresses, this lens facilitates proactive management
  of stock availability and delivery reliability. The inclusion of geospatial data enhances lead-time analysis, allowing for
  optimized routing and improved operational efficiency. This centralized intelligence layer empowers businesses to transition
  from reactive shipment tracking to a strategic Supply Chain Control Tower, ultimately driving better performance and customer
  satisfaction.
