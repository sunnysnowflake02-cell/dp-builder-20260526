name: schema-supply-chain-v2-cadp
version: v1beta
entity: product
type: data
purpose: |
  schema-supply-chain-v2
tags:
  - DPTier.Consumer Aligned
  - SemanticModelAgent
description: |
  schema-supply-chain-v2

owner: dataos-owner

v1beta:
  data:
    meta:
      title: Schema Supply Chain V2
      sourceCodeUrl: "https://github.com/your-org/your-repo/tree/main/semantic-model"
    collaborators:
      - name: dataos-owner
        description: owner

    resource:
      description: |
        This product helps teams track outcomes, spot issues early, and align decisions for schema-supply-chain-v2.
        
        It packages steward-approved sources into one consistent analytic view so everyone works from the same definitions for metrics and dimensions.
        
        Technical validation and deployment notes are included in the bundle for platform operators.
      refType: dataos
      ref: bundle:v1beta:schema-supply-chain-v2-bundle

    inputs:
      - name: icebase_supply_chain_geolocation_input
        description: |
          Operational data describing geolocation in the supply chain area. Supports shared reporting and analytics for this product.
        purpose: source
        refType: dataos
        ref: dataos://icebase:supply_chain/geolocation

      - name: icebase_supply_chain_inventory_input
        description: |
          Operational data describing inventory in the supply chain area. Supports shared reporting and analytics for this product.
        purpose: source
        refType: dataos
        ref: dataos://icebase:supply_chain/inventory

      - name: icebase_supply_chain_order_items_input
        description: |
          Operational data describing order items in the supply chain area. Supports shared reporting and analytics for this product.
        purpose: source
        refType: dataos
        ref: dataos://icebase:supply_chain/order_items

      - name: icebase_supply_chain_orders_input
        description: |
          Operational data describing orders in the supply chain area. Supports shared reporting and analytics for this product.
        purpose: source
        refType: dataos
        ref: dataos://icebase:supply_chain/orders

      - name: icebase_supply_chain_shipments_input
        description: |
          Operational data describing shipments in the supply chain area. Supports shared reporting and analytics for this product.
        purpose: source
        refType: dataos
        ref: dataos://icebase:supply_chain/shipments

      - name: icebase_supply_chain_warehouses_input
        description: |
          Operational data describing warehouses in the supply chain area. Supports shared reporting and analytics for this product.
        purpose: source
        refType: dataos
        ref: dataos://icebase:supply_chain/warehouses

      - name: icebase_supply_chain_warehouses_ranking_input
        description: |
          Operational data describing warehouses ranking in the supply chain area. Supports shared reporting and analytics for this product.
        purpose: source
        refType: dataos
        ref: dataos://icebase:supply_chain/warehouses_ranking

    outputs: []

    ports:
      lens:
        ref: lens:v1alpha:schema-supply-chain-v2:public
        refType: dataos
        meta:
          title: Schema Supply Chain V2 — curated definitions
          description: |
            Shared metrics and dimensions for governed analytics in this domain.
      rest:
        - url: https://gateway.dataos.example/lens2/api/public:schema-supply-chain-v2/v2/rest
          meta:
            title: REST API
            description: |
              Application-friendly access for dashboards, services, and automation.
      postgres:
        - host: tcp.gateway.dataos.example
          port: 5432
          params:
            ssl: true
          meta:
            title: PostgreSQL endpoint
            description: |
              SQL access for BI and analytics tools.
      graphql:
        - url: https://gateway.dataos.example/lens2/api/public:schema-supply-chain-v2/v2/graphql
          meta:
            title: GraphQL API
            description: |
              Flexible query access for applications that need curated views of this product.
