version: v1
name: wf-supply-chain-data-product-cadp-scanner
type: workflow
description: |
  Scanner workflow for consumer-aligned data product supply-chain-data-product-cadp (metadata registration in DataOS).
tags:
  - Tier.Gold
  - SemanticModelAgent
workspace: public
workflow:
  dag:
    - name: supply-chain-data-product-cadp-scanner
      description: Scanner for supply-chain-data-product-cadp (data product metadata registration).
      title: Supply Chain Data Product Cadp CADP scanner
      spec:
        stack: scanner:2.0
        compute: runnable-default
        stackSpec:
          type: data-product
          sourceConfig:
            config:
              type: DataProductMetadata
              markDeletedDataProducts: true
              dataProductFilterPattern:
                includes:
                  - supply-chain-data-product-cadp
